  <style>
    .font-tiro {
      font-family: 'Tiro Devanagari Hindi', 'Noto Serif Devanagari', serif;
      letter-spacing: 0.015em;
    }
    .font-noto-serif {
      font-family: 'Noto Serif Devanagari', serif;
      line-height: 1.9;
    }
    .font-noto-sans {
      font-family: 'Noto Sans Devanagari', sans-serif;
    }
    /* Hide scrollbar for mobile web app look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Divine, slow-breathing glow behind Guru ji's photo — refined and premium, never a hard blink */
    @keyframes glowSoft {
      0%, 100% { box-shadow: 0 0 0 0 rgba(216, 137, 0, 0.12), 0 0 0 0 rgba(255, 215, 130, 0); }
      50% { box-shadow: 0 0 18px 5px rgba(216, 137, 0, 0.22), 0 0 34px 10px rgba(255, 215, 130, 0.12); }
    }
    .animate-glow-soft {
      animation: glowSoft 5.5s infinite ease-in-out;
    }

    /* Gentle breathing ring for smaller accent icons (e.g. calendar badge) */
    @keyframes glowSoftFaint {
      0%, 100% { box-shadow: 0 0 0 0 rgba(216, 137, 0, 0.10); }
      50% { box-shadow: 0 0 10px 2px rgba(216, 137, 0, 0.20); }
    }
    .animate-glow-faint {
      animation: glowSoftFaint 4.2s infinite ease-in-out;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatSmooth 4s ease-in-out infinite;
    }

    /* Entrance animation for home-page content: fades + rises in, staggered per element via --d */
    @keyframes riseFadeIn {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-rise-in {
      opacity: 0;
      animation: riseFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0s);
    }

    /* Gentle press feedback for tappable cards — feels alive without being distracting */
    .tap-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .tap-card:active {
      transform: scale(0.96);
    }

    /* Custom Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 203, 150, 0.5);
    }
    .glass-card-dark {
      background: rgba(31, 25, 19, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(180, 120, 30, 0.4);
      color: #F8F1E5;
    }
    .glass-card-sepia {
      background: rgba(244, 234, 213, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(210, 170, 110, 0.6);
      color: #3D2817;
    }

    /* Active Pulse Dot */
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseGreen 1.6s infinite;
    }
    @keyframes pulseGreen {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Bell icon rings like a real bell every few seconds */
    @keyframes bellRing {
      0%, 6%, 100% { transform: rotate(0deg); }
      1% { transform: rotate(14deg); }
      2% { transform: rotate(-12deg); }
      3% { transform: rotate(9deg); }
      4% { transform: rotate(-7deg); }
      5% { transform: rotate(3deg); }
    }
    .animate-bell-ring {
      animation: bellRing 3.2s ease-in-out infinite;
      transform-origin: top center;
    }

    /* Today's-thought banner: a soft light sweep so the card feels "alive" without changing its layout */
    @keyframes bannerShine {
      0% { transform: translateX(-120%) skewX(-15deg); }
      100% { transform: translateX(220%) skewX(-15deg); }
    }
    .animate-banner-shine {
      animation: bannerShine 4.5s ease-in-out infinite;
    }
  </style>
</head>

      const [choghadiyaTab, setChoghadiyaTab] = useState('day');
      const [currentHour, setCurrentHour] = useState(new Date().getHours() + new Date().getMinutes()/60);

      // MODALS & SEARCH
      const [showSearch, setShowSearch] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [showNotifications, setShowNotifications] = useState(false);

      // DYNAMIC GITHUB DATA FETCHING FUNCTION (SAME LOGIC AS MONK TEST REFERENCE)
      const fetchGithubData = async () => {
        if (!githubUser || !githubRepo) {
          setSyncError('GitHub Owner/Repo सेट नहीं है — नीचे ⚙️ सेटिंग्स से भरें।');
          return;
        }
        setIsSyncing(true);
        setSyncError('');
        try {
          const rawUrl = `https://raw.githubusercontent.com/${githubUser}/${githubRepo}/${githubBranch}/${GITHUB_DATA_PATH}?_cb=${Date.now()}`;
          const res = await fetch(rawUrl, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (data.homeFolders) setHomeFolders(data.homeFolders);
            if (data.sabads) setSabads(data.sabads);
            if (data.amavasyaList) setAmavasyaList(data.amavasyaList);
            if (data.aartis) setAartis(data.aartis);
            if (data.bhajans) setBhajans(data.bhajans);
            if (data.sakhis) setSakhis(data.sakhis);
            if (data.rules) setRules(data.rules);
            if (data.melas) setMelas(data.melas);
            if (data.upiId) setUpiId(data.upiId);
            if (data.todayQuote) setTodayQuote(data.todayQuote);
            if (data.guruAvatarUrl) setGuruAvatarUrl(data.guruAvatarUrl);
            if (data.appLogoUrl !== undefined) setAppLogoUrl(data.appLogoUrl);
            if (data.appTitle) setAppTitle(data.appTitle);
            if (data.appBadge !== undefined) setAppBadge(data.appBadge);
            if (data.appTagline) setAppTagline(data.appTagline);
            if (data.dailyUpdate) setDailyUpdate(data.dailyUpdate);
            if (data.panchangInfo) setPanchangInfo(data.panchangInfo);
            if (data.upiQrUrl !== undefined) setUpiQrUrl(data.upiQrUrl);
            if (data.guruMantras) setGuruMantras(data.guruMantras);
            if (data.bichhudaData) setBichhudaData(data.bichhudaData);
            if (data.bichhudaForbidden) setBichhudaForbidden(data.bichhudaForbidden);
            if (data.bichhudaNote) setBichhudaNote(data.bichhudaNote);
            if (data.aboutText) setAboutText(data.aboutText);

            setGithubSynced(true);
            setLastSyncedAt(new Date());
            setSyncError('');
            showToastMessage("✓ नवीनतम भक्ति डेटा अपडेट हो गया!");
          } else if (res.status === 404) {
            setGithubSynced(false);
            setSyncError(`फ़ाइल नहीं मिली (404) — ${githubUser}/${githubRepo} (branch: ${githubBranch}) में "${GITHUB_DATA_PATH}" मौजूद नहीं है, या repo अभी तक admin पैनल से Publish नहीं हुआ, या repo Private है (यह ऐप बिना लॉगिन के सिर्फ़ Public repo से डेटा पढ़ सकता है)।`);
          } else {
            setGithubSynced(false);
            setSyncError(`GitHub से डेटा नहीं आया (HTTP ${res.status})। नीचे Owner/Repo/Branch जांचें कि वे बिल्कुल Admin पैनल जैसे ही हैं।`);
          }
        } catch (e) {
          console.log("GitHub sync fallback to default local dataset");
          setGithubSynced(false);
          setSyncError('नेटवर्क एरर — इंटरनेट कनेक्शन जांचें और दोबारा कोशिश करें।');
        } finally {
          setIsSyncing(false);
        }
      };

      const saveGithubSettings = () => {
        const u = ghFormUser.trim() || DEFAULT_GITHUB_USER;
        const r = ghFormRepo.trim() || DEFAULT_GITHUB_REPO;
        const b = ghFormBranch.trim() || DEFAULT_GITHUB_BRANCH;
        localStorage.setItem('sabad_gh_user', u);
        localStorage.setItem('sabad_gh_repo', r);
        localStorage.setItem('sabad_gh_branch', b);
        setGithubUser(u);
        setGithubRepo(r);
        setGithubBranch(b);
        setShowGithubModal(false);
      };

      // FETCH GITHUB DATA ON MOUNT
      useEffect(() => {
        fetchGithubData();
      }, [githubUser, githubRepo, githubBranch]);

      // UPDATE REALTIME CLOCK HOUR
      useEffect(() => {
        const timer = setInterval(() => {
          const now = new Date();
          setCurrentHour(now.getHours() + now.getMinutes() / 60);
        }, 30000);
        return () => clearInterval(timer);
      }, []);

      // ROTATE HOME BANNER BETWEEN "TODAY'S THOUGHT" AND THE ADMIN-SET DAILY UPDATE
      useEffect(() => {
        if (!dailyUpdate?.enabled) { setBannerFace(0); return; }
        const timer = setInterval(() => {
          setBannerFace((f) => (f === 0 ? 1 : 0));
        }, 6000);
        return () => clearInterval(timer);
      }, [dailyUpdate?.enabled]);

      const showToastMessage = (msg) => {
        setToastText(msg);
        setCopiedToast(true);
        setTimeout(() => setCopiedToast(false), 2800);
      };

      // WEB AUDIO SYNTHESIZER FOR TEMPLE BELL / SHANKH / JAP TAPS
      const playDevotionalSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (type === 'bell') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 2.5);
          } else if (type === 'tap') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
          } else if (type === 'shankh') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(280, ctx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.01, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.8);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.0);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 3.0);
          }
        } catch (e) {}
      };

      // AUTO SCROLL READER
      useEffect(() => {
        let scrollInterval;
        if (autoScroll) {
          scrollInterval = setInterval(() => {
            window.scrollBy({ top: scrollSpeed * 2, behavior: 'smooth' });
          }, 100);
        }
        return () => clearInterval(scrollInterval);
      }, [autoScroll, scrollSpeed]);

      // AUDIO SPECTRUM VISUALIZER FOR BHAJANS
      useEffect(() => {
        if (playingBhajanId && canvasRef.current) {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          let animId;
          const draw = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const bars = 24;
            const width = canvas.width / bars;
            for (let i = 0; i < bars; i++) {
              const height = Math.sin(Date.now() / 200 + i) * 15 + 20;
              ctx.fillStyle = '#D88900';
              ctx.fillRect(i * width, canvas.height - height, width - 2, height);
            }
            animId = requestAnimationFrame(draw);
          };
          draw();
          return () => cancelAnimationFrame(animId);
        }
      }, [playingBhajanId]);

      const copyToClipboard = (text) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        showToastMessage("विवरण कॉपी कर लिया गया है!");
      };

      const handleJapClick = () => {
        playDevotionalSound('tap');
        if (navigator.vibrate) navigator.vibrate(25);
        setJapCount((prev) => {
          const next = prev + 1;
          if (next >= targetGoal) {
            playDevotionalSound('bell');
            setMalaCompleted((m) => m + 1);
            return 0;
          }
          return next;
        });
      };

      const toggleBookmark = (id) => {
        setBookmarks(prev => prev.includes(id) ? prev.filter(b => b !== id) : [...prev, id]);
      };

      const openFolder = (folderName, itemData = null) => {
        setCurrentFolder(folderName);
        if (itemData) setSelectedItem(itemData);
        setAutoScroll(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // SABAD READER — swipe / next-prev navigation between sabads
      const touchStartRef = useRef({ x: 0, y: 0 });
      const goToAdjacentSabad = (direction) => {
        if (!selectedItem) return;
        const idx = sabads.findIndex(s => s.id === selectedItem.id);
        if (idx === -1) return;
        const nextIdx = idx + direction;
        if (nextIdx < 0 || nextIdx >= sabads.length) return;
        setSelectedItem(sabads[nextIdx]);
        setShowMeaning(false);
        setAutoScroll(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      const handleReaderTouchStart = (e) => {
        const t = e.touches[0];
        touchStartRef.current = { x: t.clientX, y: t.clientY };
      };
      const handleReaderTouchEnd = (e) => {
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartRef.current.x;
        const dy = t.clientY - touchStartRef.current.y;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          if (dx < 0) goToAdjacentSabad(1);   // swipe left (finger moves left) → next sabad
          else goToAdjacentSabad(-1);          // swipe right (finger moves right) → previous sabad
        }
      };

      const logoTapCountRef = useRef(0);
      const logoTapTimerRef = useRef(null);
      const handleLogoTap = () => {
        setActiveTab('home');
        setCurrentFolder('main');
        logoTapCountRef.current += 1;
        if (logoTapTimerRef.current) clearTimeout(logoTapTimerRef.current);
        if (logoTapCountRef.current >= 5) {
          logoTapCountRef.current = 0;
          setGhFormUser(githubUser);
          setGhFormRepo(githubRepo);
          setGhFormBranch(githubBranch);
          setShowGithubModal(true);
        } else {
          logoTapTimerRef.current = setTimeout(() => { logoTapCountRef.current = 0; }, 2500);
        }
      };

      return (
        <div className="min-h-screen bg-[#FCFAF5] text-[#4A3424] font-noto-sans antialiased selection:bg-amber-200 pb-24 max-w-md mx-auto shadow-2xl relative border-x border-amber-100/60">
          
          {/* TOAST NOTIFICATION */}
          {copiedToast && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-amber-900 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg border border-amber-400 animate-bounce flex items-center gap-1.5 font-tiro">
              <span>✓</span> {toastText}
            </div>
          )}

          {/* GLOBAL STICKY HEADER */}
          <header className="sticky top-0 z-40 bg-[#FCFAF5]/95 backdrop-blur-md border-b border-amber-200/60 px-4 py-2.5 flex items-center justify-between shadow-xs">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={handleLogoTap}>
              <GuruAvatar imgUrl={appLogoUrl || guruAvatarUrl} size="md" showAura={true} />
              <div>
                <h1 className="text-2xl font-black text-[#4A3424] tracking-wide font-tiro leading-none flex items-center gap-1.5">
                  {appTitle}
                  {appBadge && <span className="text-[10px] bg-amber-100 text-amber-900 font-bold px-1.5 py-0.5 rounded-full border border-amber-200">{appBadge}</span>}
                </h1>
                <span className="text-[9px] text-amber-800 font-semibold tracking-tight">{appTagline}</span>
              </div>
            </div>

            <div className="flex items-center space-x-1 text-amber-900">
              <button onClick={() => setShowSearch(true)} className="p-2 hover:bg-amber-100/60 active:scale-90 rounded-full transition" title="खोजें">
                <Icons.Search />
              </button>
              <button onClick={() => setShowNotifications(true)} className="p-2 hover:bg-amber-100/60 active:scale-90 rounded-full transition relative" title="सूचनाएं">
                <span className="inline-block animate-bell-ring origin-top">
                  <Icons.Bell />
                </span>
                <span className="absolute top-1 right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-black rounded-full flex items-center justify-center animate-pulse">1</span>
              </button>
            </div>
          </header>

          {/* GITHUB SYNC SETTINGS MODAL */}
          {showGithubModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center px-4 animate-fadeIn">
              <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-amber-200">
                <div className="p-4 bg-gradient-to-r from-amber-600 to-amber-700 text-white flex items-center justify-between">
                  <h3 className="font-bold text-sm flex items-center gap-2"><Icons.Github /> GitHub सिंक सेटिंग्स</h3>
                  <button onClick={() => setShowGithubModal(false)} className="p-1 rounded-full bg-white/20"><Icons.X /></button>
                </div>
                <div className="p-4 space-y-3">
                  <div className={`text-xs rounded-xl p-2.5 border flex items-center gap-2 ${githubSynced ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-700'}`}>
                    <span className={`w-2 h-2 rounded-full flex-shrink-0 ${githubSynced ? 'bg-emerald-500' : 'bg-red-500'}`}></span>
                    <span>
                      {isSyncing ? 'सिंक हो रहा है...' : githubSynced ? `जुड़ा हुआ है ✓ ${lastSyncedAt ? '(अंतिम सिंक: ' + lastSyncedAt.toLocaleTimeString() + ')' : ''}` : (syncError || 'अभी GitHub से डेटा नहीं आया')}
                    </span>
                  </div>
                  <p className="text-[11px] text-amber-800/80 leading-relaxed">
                    यहां जो Owner / Repository / Branch डालें, वो <b>बिल्कुल वैसा ही</b> होना चाहिए जैसा Admin पैनल के GitHub कनेक्शन में डाला गया है — और वह repository <b>Public</b> होनी चाहिए, तभी यह ऐप उसमें से <code>sabadwani-data.json</code> पढ़ पाएगा।
                  </p>
                  <div>
                    <label className="text-[11px] font-bold text-amber-900">GitHub Owner (Username)</label>
                    <input type="text" value={ghFormUser} onChange={(e) => setGhFormUser(e.target.value)} placeholder="vishnoiji29" className="w-full mt-1 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-sm text-amber-950" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-amber-900">Repository का नाम</label>
                    <input type="text" value={ghFormRepo} onChange={(e) => setGhFormRepo(e.target.value)} placeholder="sabadwani-app" className="w-full mt-1 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-sm text-amber-950" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-amber-900">Branch</label>
                    <input type="text" value={ghFormBranch} onChange={(e) => setGhFormBranch(e.target.value)} placeholder="main" className="w-full mt-1 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-sm text-amber-950" />
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button onClick={saveGithubSettings} className="flex-1 bg-amber-700 text-white font-bold text-sm py-2.5 rounded-xl active:scale-95 transition">सेव करें और सिंक करें</button>
                    <button onClick={fetchGithubData} disabled={isSyncing} className="p-2.5 rounded-xl border border-amber-300 text-amber-800 active:scale-90 transition disabled:opacity-50" title="अभी दोबारा सिंक करें">
                      <Icons.RefreshCw />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* SEARCH MODAL */}
          {showSearch && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-start justify-center pt-10 px-4 animate-fadeIn">
              <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-amber-200">
                <div className="p-3 bg-amber-50 border-b border-amber-200 flex items-center gap-2">
                  <Icons.Search />
                  <input 
                    type="text" 
                    placeholder="सबद, नियम, आरती या मेला खोजें..." 
                    className="w-full bg-transparent text-xs font-semibold text-amber-950 focus:outline-none"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    autoFocus
                  />
                  <button onClick={() => setShowSearch(false)} className="text-xs bg-amber-200 text-amber-900 font-bold px-3 py-1 rounded-full font-tiro">
                    बंद
                  </button>
                </div>
                <div className="p-3 max-h-80 overflow-y-auto space-y-2">
                  {sabads.filter(s => s.title.includes(searchQuery) || searchQuery === '').slice(0, 6).map(s => (
                    <div key={s.id} onClick={() => { setShowSearch(false); openFolder('sabad_reader', s); }} className="p-3 rounded-2xl border border-amber-100 hover:bg-amber-50 cursor-pointer flex justify-between items-center transition">
                      <div>
                        <span className="font-bold text-xs text-amber-900 font-tiro">{s.title}</span>
                        <p className="text-[10px] text-amber-800/70 truncate w-64 font-noto-serif">{s.verses?.[0]}</p>
                      </div>
                      <Icons.ChevronRight />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* NOTIFICATION MODAL */}
          {showNotifications && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-start justify-center pt-16 px-4">
              <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-amber-200">
                <div className="p-3.5 bg-gradient-to-r from-amber-600 to-amber-700 text-white flex justify-between items-center">
                  <h3 className="font-bold text-xs flex items-center gap-1.5 font-tiro"><Icons.Bell /> महत्वपूर्ण देव संदेश</h3>
                  <button onClick={() => setShowNotifications(false)} className="text-xs bg-white/20 px-3 py-1 rounded-full font-bold">बंद</button>
                </div>
                <div className="p-4 space-y-3 text-xs">
                  <div className="p-3 bg-amber-50 rounded-2xl border border-amber-200">
                    <span className="font-bold text-amber-900 font-tiro">माघ अमावस्या मेला सूचना</span>
                    <p className="text-amber-800 mt-1 font-noto-sans">18 जनवरी को समराथल धोरा एवं मुकाम धाम में विशाल मेला आयोजित होगा।</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MAIN SCREEN CONTENT */}
          <main className="p-3.5 space-y-3.5">

            {activeTab === 'home' && currentFolder === 'main' && (
              <>
                {/* TODAY'S THOUGHT CARD — rotates smoothly with an admin-set daily update banner, when enabled */}
                <div
                  className="relative rounded-3xl shadow-lg overflow-hidden border border-amber-300/40 animate-float animate-rise-in"
                  style={{ '--d': '0.05s', minHeight: dailyUpdate?.enabled ? '176px' : undefined }}
                >
                  {/* QUOTE FACE */}
                  <div
                    className={`p-5 bg-gradient-to-br from-[#E69500] via-[#D88900] to-[#B86B00] text-white transition-all duration-700 ease-in-out ${
                      dailyUpdate?.enabled
                        ? (bannerFace === 0 ? 'relative opacity-100 translate-y-0' : 'absolute inset-0 opacity-0 -translate-y-1.5 pointer-events-none')
                        : 'relative opacity-100'
                    }`}
                  >
                    <div className="absolute inset-0 pointer-events-none overflow-hidden rounded-3xl">
                      <div className="absolute top-0 -left-1/2 w-1/3 h-full bg-gradient-to-r from-transparent via-white/25 to-transparent animate-banner-shine"></div>
                    </div>
                    <div className="absolute -right-4 -top-4 opacity-20 text-white p-2">
                      <Icons.Sun />
                    </div>

                    <div className="flex items-center space-x-2 mb-2">
                      <span className="text-base">❝</span>
                      <span className="text-xs font-bold tracking-wide text-amber-100 font-tiro">आज का सुविचार</span>
                    </div>

                    <blockquote className="text-lg font-bold leading-relaxed mb-3 text-amber-50 font-tiro drop-shadow-xs">
                      "{todayQuote.text}"
                    </blockquote>

                    <div className="flex justify-between items-center border-t border-amber-400/30 pt-2 text-[11px] text-amber-100 font-tiro font-bold">
                      <button onClick={() => copyToClipboard(`"${todayQuote.text}" – ${todayQuote.author}`)} className="flex items-center gap-1 bg-white/10 px-2.5 py-1 rounded-full hover:bg-white/20">
                        <Icons.Share /> शेयर करें
                      </button>
                      <span>– {todayQuote.author}</span>
                    </div>
                  </div>

                  {/* DAILY UPDATE FACE (admin-controlled) */}
                  {dailyUpdate?.enabled && (
                    <div
                      className={`p-5 bg-gradient-to-br from-[#E69500] via-[#D88900] to-[#B86B00] text-white transition-all duration-700 ease-in-out ${
                        bannerFace === 1 ? 'relative opacity-100 translate-y-0' : 'absolute inset-0 opacity-0 translate-y-1.5 pointer-events-none'
                      }`}
                    >
                      <div className="absolute inset-0 pointer-events-none overflow-hidden rounded-3xl">
                        <div className="absolute top-0 -left-1/2 w-1/3 h-full bg-gradient-to-r from-transparent via-white/25 to-transparent animate-banner-shine"></div>
                      </div>
                      <div className="absolute -right-4 -top-4 opacity-20 text-white p-2">
                        <Icons.Sun />
                      </div>

                      <div className="flex items-start gap-4">
                        <div className="relative w-20 h-20 rounded-2xl overflow-hidden border-2 border-white/40 shadow-md flex-shrink-0 bg-white/10">
                          <img src={dailyUpdate.image || guruAvatarUrl} className="w-full h-full object-cover" alt="" />
                          <span className="absolute -bottom-1.5 -right-1.5 w-6 h-6 bg-amber-400 rounded-full flex items-center justify-center border-2 border-white text-white text-xs font-black shadow-sm">✓</span>

                  ))}
                </div>
              </div>
            )}

            {currentFolder === 'sakhi_reader' && selectedItem && (
              <div className="space-y-3 animate-fadeIn">
                <div className="bg-white p-2.5 rounded-2xl border border-amber-200 shadow-xs flex items-center justify-between text-xs">
                  <button onClick={() => setCurrentFolder('sakhi')} className="p-1 text-amber-900"><Icons.ChevronLeft /></button>
                  <span className="font-bold text-amber-900 font-tiro">{selectedItem.title}</span>
                  <Icons.Book />
                </div>

                <div className="bg-white rounded-3xl p-5 border border-amber-200 shadow-md text-center leading-relaxed text-amber-950 font-noto-serif text-base">
                  {selectedItem.verses?.map((v, i) => <p key={i} className="py-1">{v}</p>)}
                </div>
              </div>
            )}

            {currentFolder === 'guru_mantra' && (
              <div className="space-y-3 animate-fadeIn">
                <div className="bg-gradient-to-r from-amber-600 to-amber-700 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-between">
                  <button onClick={() => setCurrentFolder('main')} className="p-1 rounded-full bg-white/20"><Icons.ChevronLeft /></button>
                  <h2 className="font-bold text-base font-tiro">॥ गुरु मंत्र ॥</h2>
                  <Icons.Music />
                </div>

                <div className="space-y-3 font-noto-sans">
                  {guruMantras.map((m) => (
                    <div key={m.id} className="bg-white rounded-2xl p-4 border border-amber-200 shadow-xs flex items-center gap-3">
                      {m.playable && (
                        <button onClick={() => playDevotionalSound('shankh')} className="w-9 h-9 flex-shrink-0 rounded-full bg-amber-100 border border-amber-300 flex items-center justify-center text-amber-700">
                          <Icons.Play />
                        </button>
                      )}
                      <div className="space-y-1">
                        <h3 className="font-bold text-sm text-amber-950 font-tiro">{m.title}</h3>
                        <p className="text-xs text-amber-800/80 leading-relaxed">{m.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {currentFolder === 'bichhuda' && (
              <div className="space-y-3 animate-fadeIn">
                <div className="bg-gradient-to-r from-amber-600 to-amber-700 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-between">
                  <button onClick={() => setCurrentFolder('main')} className="p-1 rounded-full bg-white/20"><Icons.ChevronLeft /></button>
                  <h2 className="font-bold text-base font-tiro">॥ बिछुड़ा (विंदर) ॥</h2>
                  <Icons.Book />
                </div>

                <div className="bg-white rounded-3xl p-4 border border-amber-200 shadow-xs space-y-3">
                  <div className="flex items-center justify-between gap-2">
                    <h3 className="font-bold text-sm text-amber-950 font-tiro">बिछुड़ा तिथियां</h3>
                    <div className="flex gap-2">
                      <select
                        value={bichhudaSel}
                        onChange={(e) => setBichhudaSel(parseInt(e.target.value))}
                        className="bg-amber-50 border border-amber-200 rounded-xl px-2.5 py-1.5 text-xs font-bold text-amber-900 font-tiro"
                      >
                        {bichhudaData.map((b, idx) => (
                          <option key={b.id} value={idx}>{b.month}</option>
                        ))}
                      </select>
                      <span className="bg-amber-50 border border-amber-200 rounded-xl px-2.5 py-1.5 text-xs font-bold text-amber-900">
                        {bichhudaData[bichhudaSel]?.year}
                      </span>
                    </div>
                  </div>

                  {bichhudaData[bichhudaSel] && (
                    <div className="bg-[#FCFAF5] rounded-2xl p-4 border border-amber-200 relative">
                      {bichhudaData[bichhudaSel].upcoming && (
                        <span className="absolute top-0 right-0 bg-amber-500 text-white font-bold text-[9px] px-3 py-1 rounded-bl-2xl rounded-tr-2xl font-tiro">आगामी</span>
                      )}
                      <h4 className="font-black text-lg text-amber-800 font-tiro mb-2">{bichhudaData[bichhudaSel].month} {bichhudaData[bichhudaSel].year}</h4>
                      <div className="text-xs space-y-1.5 font-noto-sans">
                        <p><span className="font-bold text-amber-900">प्रारंभ:</span> {bichhudaData[bichhudaSel].start}</p>
                        <p><span className="font-bold text-amber-900">समाप्तः</span> {bichhudaData[bichhudaSel].end}</p>
                      </div>
                    </div>
                  )}
                </div>

                <div className="bg-red-50 rounded-2xl p-4 border border-red-200 space-y-2 text-xs">
                  <h3 className="font-bold text-red-900 font-tiro">वर्जित कार्य</h3>
                  <ul className="text-red-800 space-y-1 list-disc pl-4 font-noto-sans">
                    {bichhudaForbidden.map((item, idx) => <li key={idx}>{item}</li>)}
                  </ul>
                </div>

                <p className="text-[11px] text-amber-800/70 italic text-center leading-relaxed px-1 font-noto-sans">
                  {bichhudaNote}
                </p>
              </div>
            )}

            {currentFolder === 'melas' && (
              <div className="space-y-3.5 animate-fadeIn">
                <div className="bg-gradient-to-r from-amber-600 to-amber-700 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-between">
                  <button onClick={() => setCurrentFolder('main')} className="p-1 rounded-full bg-white/20"><Icons.ChevronLeft /></button>
                  <h2 className="font-bold text-base font-tiro">॥ आगामी प्रमुख मेले ॥</h2>
                  <Icons.Users />
                </div>

                <div className="space-y-3 font-noto-sans">
                  {melas.map((mela, idx) => (
                    <div key={idx} className="bg-white rounded-3xl p-4 border border-amber-200 shadow-sm space-y-2 relative overflow-hidden">
                      {mela.badge && <span className="absolute top-0 right-0 bg-amber-500 text-white font-bold text-[9px] px-3 py-1 rounded-bl-2xl font-tiro">{mela.badge}</span>}
                      <h3 className="font-black text-sm text-amber-950 pr-12 font-tiro">{mela.title}</h3>
                      <p className="text-xs font-bold text-amber-900 flex items-center gap-1.5"><Icons.Calendar /> {mela.date}</p>
                      <p className="text-xs text-amber-800/80 leading-relaxed font-medium">📍 {mela.location}</p>
                      <div className="bg-amber-50/60 p-2.5 rounded-xl text-xs text-amber-900 font-medium border border-amber-100">{mela.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'about' && (
              <div className="space-y-3.5 animate-fadeIn">
                <div className="bg-gradient-to-r from-amber-600 via-amber-700 to-yellow-700 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-between">
                  <button onClick={() => { setActiveTab('home'); setCurrentFolder('main'); }} className="p-1 rounded-full bg-white/20"><Icons.ChevronLeft /></button>
                  <h2 className="font-black text-base font-tiro">॥ हमारे बारे में ॥</h2>
                  <Icons.Info />
                </div>

                <div className="flex justify-center py-2">
                  <GuruAvatar imgUrl={guruAvatarUrl} size="xl" showAura={true} />
                </div>

                <div className="bg-white rounded-3xl p-5 border border-amber-200 shadow-md space-y-4 text-xs leading-relaxed font-noto-sans">
                  <p className="font-black text-sm text-amber-950 font-tiro text-center">
                    {aboutText.heading}
                  </p>
                  <div>
                    <p className="font-black text-amber-950 mb-1">{aboutText.disclaimerTitle}</p>
                    <p className="text-amber-900/90 font-medium">
                      {aboutText.disclaimerBody}
                    </p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'privacy' && (
              <div className="space-y-3.5 animate-fadeIn">
                <div className="bg-gradient-to-r from-amber-600 via-amber-700 to-yellow-700 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-between">
                  <button onClick={() => { setActiveTab('home'); setCurrentFolder('main'); }} className="p-1 rounded-full bg-white/20"><Icons.ChevronLeft /></button>
                  <h2 className="font-black text-base font-tiro">॥ गोपनीयता नीति ॥</h2>
                  <Icons.Shield />
                </div>

                <div className="bg-white rounded-3xl p-5 border border-amber-200 shadow-md space-y-3 text-xs leading-relaxed font-noto-sans">
                  <h3 className="font-bold text-sm text-amber-950 font-tiro">गोपनीयता और डेटा सुरक्षा</h3>
                  <p>यह ऐप आपकी व्यक्तिगत जानकारी एकत्र नहीं करता है। जाप माला गिनती और आपकी पसंद का डेटा आपके फ़ोन में ही सुरक्षित रहता है।</p>
                </div>
              </div>
            )}

          </main>

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#FCFAF5]/95 backdrop-blur-md border-t border-amber-200/80 px-2 py-1 flex items-center justify-around z-40 font-tiro text-[10px]">
            {[
              { id: 'home', label: 'होम', icon: Icons.Home },
              { id: 'support', label: 'सहयोग', icon: Icons.HandHeart },
              { id: 'amavasya', label: 'अमावस्या', icon: Icons.Calendar },
              { id: 'about', label: 'हमारे बारे में', icon: Icons.Info },
              { id: 'privacy', label: 'गोपनीयता', icon: Icons.Shield },
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => { setActiveTab(tab.id); setCurrentFolder('main'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                className={`flex flex-col items-center py-1 px-2 transition ${activeTab === tab.id && currentFolder === 'main' ? 'text-amber-700 font-extrabold scale-105' : 'text-amber-900/60'}`}
              >
                <tab.icon />
                <span className="mt-0.5">{tab.label}</span>
              </button>
            ))}
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
