<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>सब्दवाणी - श्री गुरु जंभेश्वर भक्ति ऐप</title>
  <!-- PWA: installable + offline. manifest.json and sw.js must sit next to this
       index.html in the repo root (provided alongside this file). -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D88900">
  <link rel="canonical" href="https://bishnois.vercel.app/">

  <!-- TAILWIND CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GOOGLE FONTS (TIRO DEVANAGARI, NOTO SERIF, NOTO SANS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 20 curated premium Hindi/Devanagari fonts — selectable live from the admin panel.
       (Kohinoor Devanagari is a licensed Apple/ITF font, not on Google Fonts — it is kept
       in the CSS font-stack below as a named fallback for devices that already have it installed.) -->
  <!-- BUG FIX (speed): the old version loaded ALL 20 curated font families here
       (huge render-blocking CSS) AND loaded the 3 actually-selected fonts again
       via #dynamicFontLink at mount. That was double work. Now we only preload the
       3 default families immediately (fast) — dynamicFontLink still swaps in
       whatever the admin panel selects, on demand. -->
  <link id="defaultFontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap">
  <link id="dynamicFontLink" rel="stylesheet" href="">

  <!-- REACT & REACT-DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- SPEED + RELIABILITY FIX: the old version shipped @babel/standalone (a ~1.2MB
       in-browser JSX compiler) and re-compiled the entire app's JSX EVERY time someone
       opened the page. On a slow connection (the "11 KB/s" case) that one script alone
       could take minutes to download, and until it finished nothing could render at
       all — matching exactly the "app khulti hi nahi" complaint. The app's JSX is now
       pre-compiled to plain JavaScript (see the script tag near the closing </body> —
       search "PRE-COMPILED APP"), so Babel is no longer needed in the browser at all. -->

  <style>
    /* Admin-controlled premium font system — the admin panel writes these three
       families into sabadwani-data.json ("fonts"), the app applies them here. */
    :root {
      --font-heading: 'Tiro Devanagari Hindi';
      --font-body: 'Noto Serif Devanagari';
      --font-ui: 'Noto Sans Devanagari';
    }
    .font-tiro {
      font-family: var(--font-heading), 'Kohinoor Devanagari', 'Tiro Devanagari Hindi', 'Noto Serif Devanagari', serif;
      letter-spacing: 0.015em;
    }
    .font-noto-serif {
      font-family: var(--font-body), 'Kohinoor Devanagari', 'Noto Serif Devanagari', serif;
      line-height: 1.9;
    }
    .font-noto-sans {
      font-family: var(--font-ui), 'Kohinoor Devanagari', 'Noto Sans Devanagari', sans-serif;
    }
    /* Hide scrollbar for mobile web app look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Divine, slow-breathing glow behind Guru ji's photo — refined and premium, never a hard blink */
    @keyframes glowSoft {
      0%, 100% { box-shadow: 0 0 0 0 rgba(216, 137, 0, 0.12), 0 0 0 0 rgba(255, 215, 130, 0); }
      50% { box-shadow: 0 0 18px 5px rgba(216, 137, 0, 0.22), 0 0 34px 10px rgba(255, 215, 130, 0.12); }
    }
    .animate-glow-soft {
      animation: glowSoft 5.5s infinite ease-in-out;
    }

    /* Gentle breathing ring for smaller accent icons (e.g. calendar badge) */
    @keyframes glowSoftFaint {
      0%, 100% { box-shadow: 0 0 0 0 rgba(216, 137, 0, 0.10); }
      50% { box-shadow: 0 0 10px 2px rgba(216, 137, 0, 0.20); }
    }
    .animate-glow-faint {
      animation: glowSoftFaint 4.2s infinite ease-in-out;
    }

    @keyframes floatSmooth {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatSmooth 4s ease-in-out infinite;
    }

    /* Entrance animation for home-page content: fades + rises in, staggered per element via --d */
    @keyframes riseFadeIn {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-rise-in {
      opacity: 0;
      animation: riseFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--d, 0s);
    }

    /* Gentle press feedback for tappable cards — feels alive without being distracting */
    .tap-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .tap-card:active {
      transform: scale(0.96);
    }

    /* Custom Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(229, 203, 150, 0.5);
    }
    .glass-card-dark {
      background: rgba(31, 25, 19, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(180, 120, 30, 0.4);
      color: #F8F1E5;
    }
    .glass-card-sepia {
      background: rgba(244, 234, 213, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(210, 170, 110, 0.6);
      color: #3D2817;
    }

    /* Active Pulse Dot */
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseGreen 1.6s infinite;
    }
    @keyframes pulseGreen {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Bell icon rings like a real bell every few seconds */
    @keyframes bellRing {
      0%, 6%, 100% { transform: rotate(0deg); }
      1% { transform: rotate(14deg); }
      2% { transform: rotate(-12deg); }
      3% { transform: rotate(9deg); }
      4% { transform: rotate(-7deg); }
      5% { transform: rotate(3deg); }
    }
    .animate-bell-ring {
      animation: bellRing 3.2s ease-in-out infinite;
      transform-origin: top center;
    }

    /* Today's-thought banner: a soft light sweep so the card feels "alive" without changing its layout */
    @keyframes bannerShine {
      0% { transform: translateX(-120%) skewX(-15deg); }
      100% { transform: translateX(220%) skewX(-15deg); }
    }
    .animate-banner-shine {
      animation: bannerShine 4.5s ease-in-out infinite;
    }
  </style>
</head>

  <!-- INSTANT SPLASH (pure HTML/CSS, shows before React/Babel even parse — fixes the
       "site load bohot slow lagta hai" complaint by giving instant first paint).
       Hidden automatically once the app has data (cache or network) and mounts. -->
  <div id="bootSplash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FCFAF5;transition:opacity .35s ease;">
    <div style="width:56px;height:56px;border-radius:50%;border:3px solid #E8DCC4;border-top-color:#D88900;animation:bootspin 0.9s linear infinite;"></div>
    <div style="margin-top:14px;font-family:'Noto Sans Devanagari',sans-serif;color:#8a6a3a;font-size:14px;" id="bootSplashText">सब्दवाणी लोड हो रहा है…</div>
  </div>
  <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>

  <!-- WATCHDOG: runs immediately, independent of React/the app script below — so even
       if a slow/broken connection stops the app itself from ever starting, the person
       still gets a clear message instead of a spinner stuck forever with no explanation. -->
  <script>
    setTimeout(function () {
      var root = document.getElementById('root');
      var splash = document.getElementById('bootSplash');
      if (splash && (!root || !root.firstChild)) {
        document.getElementById('bootSplashText').innerHTML =
          'इंटरनेट धीमा लग रहा है… <br><button onclick="location.reload()" style="margin-top:10px;background:#D88900;color:#fff;border:none;padding:8px 18px;border-radius:999px;font-weight:bold;">दोबारा कोशिश करें</button>';
      }
    }, 12000);
  </script>
